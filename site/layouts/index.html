{{ define "main" }}
<section class="hero-video-shell js-hero-stage" aria-label="CleanMac Hero">
  <div class="hero-video-frame">
    <video class="hero-video" autoplay muted loop playsinline poster="{{ `images/cleanmac-icon.png` | relURL }}">
      <source src="{{ `videos/output-mobile.mp4` | relURL }}" type="video/mp4">
      你的浏览器不支持 HTML5 视频播放。
    </video>
    <div class="hero-overlay"></div>
    <div class="hero-noise"></div>
    <div class="hero-content shell">
      <div class="hero-copy js-hero-copy">
        <div class="eyebrow dark">CleanMac for macOS</div>
        <h1>CleanMac.</h1>
        <p class="subhead">让 Mac 恢复轻盈，像新的一样自然。</p>
        <p class="lead">扫描磁盘占用、识别可安全清理项、整理开发缓存，并在更克制、更安静的界面里完成一切。</p>
      </div>

      <div class="hero-cta js-hero-cta">
        <div class="hero-actions">
          <a class="button primary large" href="{{ site.Params.dmgURL | relURL }}">下载 DMG</a>
        </div>
        <p class="fineprint">适用于 macOS 13 及以上版本</p>
      </div>
    </div>
  </div>
</section>

<script>
(() => {
  const stage = document.querySelector('.js-hero-stage');
  const copy = document.querySelector('.js-hero-copy');
  const cta = document.querySelector('.js-hero-cta');
  const button = stage?.querySelector('.button');
  if (!stage || !copy || !cta) return;

  let hidden = false;

  const hidePanels = () => {
    hidden = true;
    stage.classList.add('is-hidden');
  };

  const showPanels = () => {
    hidden = false;
    stage.classList.remove('is-hidden');
  };

  stage.addEventListener('click', (event) => {
    if (button && button.contains(event.target)) {
      return;
    }

    if (hidden) {
      showPanels();
    } else {
      hidePanels();
    }
  });
})();
</script>
{{ end }}
