title = 'CleanMac'
defaultContentLanguage = 'zh-cn'
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[params]
  description = 'CleanMac 是一款为 macOS 打造的磁盘清理与空间巡检工具，帮助你识别大文件、开发缓存、日志与隐私残留。'
  githubRepo = 'https://github.com/ruwin985/CleanMac'
  downloadText = '查看 GitHub 项目'
  heroTagline = '更干净的磁盘，更轻松的 Mac。'
  heroSubtitle = '使用 SwiftUI 构建，聚焦磁盘空间分析、安全清理、隐私残留巡检与基础性能优化。'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
