name: CleanMac
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.zyb.CleanMac
    SWIFT_VERSION: 5.10
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_APP_SANDBOX: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  CleanMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Support/MenuBarController.swift
          - Support/AppLifecycleController.swift
      - path: Resources
    dependencies:
      - target: CleanMacMenuBar
        embed: true
    settings:
      base:
        PRODUCT_NAME: CleanMac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []

  CleanMacMenuBar:
    type: application
    platform: macOS
    sources:
      - path: MenuBarApp
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: CleanMacMenuBar
        PRODUCT_BUNDLE_IDENTIFIER: com.zyb.CleanMac.MenuBar
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    scheme:
      testTargets: []
