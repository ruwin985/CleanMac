name: CleanMac
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: '11.0'
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.zyb.CleanMac
    SWIFT_VERSION: 5.10
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_APP_SANDBOX: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  CleanMac:
    type: application
    platform: macOS
    info:
      path: Resources/CleanMac-Info.plist
      properties:
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CleanMacLicenseValidationKey: "$(INFOPLIST_KEY_CleanMacLicenseValidationKey)"
        CleanMacLicenseServerURL: "$(INFOPLIST_KEY_CleanMacLicenseServerURL)"
        CleanMacPurchaseURL: "$(INFOPLIST_KEY_CleanMacPurchaseURL)"
        CleanMacRefundURL: "$(INFOPLIST_KEY_CleanMacRefundURL)"
        CleanMacTencentSurveyURL: "$(INFOPLIST_KEY_CleanMacTencentSurveyURL)"
        LSApplicationCategoryType: "$(INFOPLIST_KEY_LSApplicationCategoryType)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "$(INFOPLIST_KEY_NSHumanReadableCopyright)"
    sources:
      - path: Sources
        excludes:
          - Support/MenuBarController.swift
          - Support/AppLifecycleController.swift
      - path: Resources
        excludes:
          - CleanMac-Info.plist
    dependencies:
      - target: CleanMacMenuBar
        embed: true
    postBuildScripts:
      - name: Embed MenuBar Login Item
        script: |
          set -e
          LOGIN_ITEMS_DIR="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Library/LoginItems"
          mkdir -p "$LOGIN_ITEMS_DIR"
          ditto "$BUILT_PRODUCTS_DIR/CleanMacMenuBar.app" "$LOGIN_ITEMS_DIR/CleanMacMenuBar.app"
    settings:
      base:
        PRODUCT_NAME: CleanMac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CleanMacPurchaseURL: "https://item.taobao.com/item.htm?id=1073046083571&spm=a213gs.v2success.0.0.3ab04831aFHLNV"
        INFOPLIST_KEY_CleanMacRefundURL: "https://ruwin.cn/legal/refund/"
        INFOPLIST_KEY_CleanMacLicenseValidationKey: "XJ2OZ+i3UHCVar7NMCZ2RMoTnC9hTuf6Q0k+Lcrl7FA"
        INFOPLIST_KEY_CleanMacLicenseServerURL: "https://ruwin.cn"
        INFOPLIST_KEY_CleanMacTencentSurveyURL: "https://wj.qq.com/s2/27497302/29c4/"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []

  CleanMacMenuBar:
    type: application
    platform: macOS
    sources:
      - path: MenuBarApp
      - path: Resources
        excludes:
          - CleanMac-Info.plist
    settings:
      base:
        PRODUCT_NAME: CleanMacMenuBar
        PRODUCT_BUNDLE_IDENTIFIER: com.zyb.CleanMac.MenuBar
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    scheme:
      testTargets: []
